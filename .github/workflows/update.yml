name: Update Codex
run-name: Update Codex (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Codex version without rust-v; blank selects latest stable
        required: false
        type: string
      request_id:
        description: Anonymous caller correlation ID
        required: true
        type: string

concurrency:
  group: codex-update
  # GitHub queues up to 100 pending runs; actionlint 1.7.12 does not parse this key yet.
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Record checked-out main revision
        id: base
        shell: bash
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$base_sha" >>"$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            system-features = benchmark big-parallel kvm nixos-test codex-artifact-publisher

      - name: Install nix-update
        shell: bash
        run: |
          set -euo pipefail
          # nix-update v1.16.0
          nix profile install 'github:Mic92/nix-update/f1312346bf252dc10a0b6f70aae80c0a32395c5c#nix-update'

      - name: Reclaim disk space for Codex build
        shell: bash
        run: |
          set -euo pipefail
          sudo env \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            bash scripts/reclaim-runner-disk.sh

      - name: Update and validate
        id: update
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          set +e
          if [[ -n "$REQUESTED_VERSION" ]]; then
            bash scripts/update.sh "$REQUESTED_VERSION"
          else
            bash scripts/update.sh
          fi
          update_status=$?
          set -e

          case "$update_status" in
            0) printf 'changed=true\n' >>"$GITHUB_OUTPUT" ;;
            10) printf 'changed=false\n' >>"$GITHUB_OUTPUT" ;;
            *) exit "$update_status" ;;
          esac

          version=$(nix eval --raw .#codex.version)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Commit generated package update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(git diff --name-only)
          [[ ${#changed_files[@]} -eq 1 ]]
          [[ ${changed_files[0]} == package.nix ]]

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.nix
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "codex: update to $VERSION"

      - name: Push validated update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git push --force-with-lease="refs/heads/main:$BASE_SHA" \
            origin HEAD:refs/heads/main

      - name: Publish or validate immutable release
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-bundle.sh

  install-smoke:
    name: Verify fresh release import
    needs: update
    permissions:
      contents: read
    uses: ./.github/workflows/install-smoke.yml
