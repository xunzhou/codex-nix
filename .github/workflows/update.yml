name: Update Codex
run-name: Update Codex (${{ inputs.request_id || 'scheduled' }})

on:
  push:
    branches: [main]
    paths:
      - build.json
      - flake.nix
      - flake.lock
      - package.nix
      - patches/**
      - scripts/**
      - .github/workflows/update.yml
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Codex version without rust-v; blank selects latest stable
        required: false
        type: string
      request_id:
        description: Anonymous caller correlation ID
        required: true
        type: string

concurrency:
  group: codex-update
  # Keep candidate preparation, both builds, and publication in one serialized run.
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.candidate.outputs.base }}
      sha: ${{ steps.candidate.outputs.sha }}
      changed: ${{ steps.candidate.outputs.changed }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            system-features = benchmark big-parallel kvm nixos-test codex-artifact-publisher
      - name: Prepare candidate without publishing it
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          CODEX_UPDATE_PREPARE_ONLY: '1'
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          changed=false
          if [[ "$EVENT_NAME" != push ]]; then
            set +e
            if [[ -n "$REQUESTED_VERSION" ]]; then
              bash scripts/update.sh "$REQUESTED_VERSION"
            else
              bash scripts/update.sh
            fi
            status=$?
            set -e
            case "$status" in
              0) changed=true ;;
              10) ;;
              *) exit "$status" ;;
            esac
          fi
          version=$(python3 -c 'import json; print(json.load(open("build.json"))["default_version"])')
          if [[ "$changed" == true ]]; then
            mapfile -t changed_files < <(git diff --name-only)
            for path in "${changed_files[@]}"; do
              [[ $path == build.json || $path == patches/* ]]
            done
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add build.json patches
            git diff --cached --check
            git commit -m "codex: update to $version"
          fi
          printf 'base=%s\nsha=%s\nchanged=%s\nversion=%s\n' \
            "$base_sha" "$(git rev-parse HEAD)" "$changed" "$version" >>"$GITHUB_OUTPUT"
          git bundle create "$RUNNER_TEMP/source.bundle" HEAD
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-source
          path: ${{ runner.temp }}/source.bundle
          retention-days: 14

  nix:
    name: Build Nix closure
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Restore exact candidate commit
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch "$RUNNER_TEMP/release-source/source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git checkout --detach "$EXPECTED_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            system-features = benchmark big-parallel kvm nixos-test codex-artifact-publisher
      - name: Reclaim runner disk space
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" bash scripts/reclaim-runner-disk.sh
      - name: Run validation suites
        run: |
          python3 tests/source-patcher.py
          python3 tests/manifest.py
          python3 tests/release.py
          python3 tests/rebase-patches.py
          python3 tests/release-client.py
          python3 tests/release-setup.py
          bash tests/package-policy.sh
          bash tests/update.sh
          bash tests/bundle.sh
          nix flake check --no-build
      - name: Build and prepare Nix release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          nix --extra-system-features codex-artifact-publisher build -L .#codex
          test "$(./result/bin/codex --version)" = "codex-cli $VERSION"
          grep -aFqm1 'terminal palette refresh did not return default colors' ./result/bin/codex
          ./result/bin/codex-code-mode-host --help >/dev/null
          bash scripts/publish-bundle.sh --prepare-dir "$RUNNER_TEMP/nix-assets"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-nix
          path: ${{ runner.temp }}/nix-assets/*
          retention-days: 14

  native:
    name: Build static native Linux binaries
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CARGO_BUILD_JOBS: 2
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Restore exact candidate commit
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch "$RUNNER_TEMP/release-source/source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git checkout --detach "$EXPECTED_SHA"
      - name: Reclaim runner disk space
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" bash scripts/reclaim-runner-disk.sh
      # Same Zig as upstream's musl release builds.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Install musl toolchain from the pinned upstream source
        run: bash scripts/setup-musl-toolchain.sh
      - name: Install nextest
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/cargo-nextest-0.9.146-x86_64-unknown-linux-gnu.tar.gz
          echo '682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428  '"$RUNNER_TEMP/nextest.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/nextest" cargo-nextest
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - name: Build, test patches, and verify static binary pair
        env:
          CODEX_PATCH_CACHE: ${{ runner.temp }}/native-cache
          CODEX_VERIFY_PATCHES: '1'
        run: |
          set -euo pipefail
          unset NO_COLOR TMUX TERM_PROGRAM
          mkdir -p "$RUNNER_TEMP/codex-home"
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          python3 scripts/install-source-codex.py --build-only --version "$VERSION" --output dist/native.tar.gz
          mkdir smoke
          tar -xzf dist/native.tar.gz -C smoke
          python3 - <<'PYTHON'
          import hashlib, json
          from pathlib import Path
          for name, checksum in json.loads(Path('smoke/sha256.json').read_text()).items():
              with (Path('smoke') / name).open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == checksum
          PYTHON
          for binary in smoke/codex smoke/codex-code-mode-host; do
            file "$binary"
            # Static: no program interpreter and no shared library dependencies.
            if readelf -lW "$binary" | grep -q INTERP || readelf -dW "$binary" | grep -q NEEDED; then
              echo "$binary is dynamically linked" >&2
              exit 1
            fi
          done
          test "$(smoke/codex --version)" = "codex-cli $VERSION"
          smoke/codex-code-mode-host --help >/dev/null
          key=$(python3 -c 'import json; print(json.load(open("smoke/bundle.json"))["key"])')
          mv dist/native.tar.gz "dist/codex-native-$key-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-native
          path: dist/codex-native-*.tar.gz
          retention-days: 14

  publish:
    name: Publish combined release
    needs: [prepare, nix, native]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Restore exact candidate commit
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch "$RUNNER_TEMP/release-source/source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git checkout --detach "$EXPECTED_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            system-features = benchmark big-parallel kvm nixos-test codex-artifact-publisher
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-nix
          path: ${{ runner.temp }}/release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-native
          path: ${{ runner.temp }}/release-assets
      - name: Push candidate only after both builds pass
        if: needs.prepare.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
        run: |
          git push --force-with-lease="refs/heads/main:$BASE_SHA" origin HEAD:refs/heads/main
      - name: Publish or verify both immutable artifact sets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/lib/bundle.sh
          codex_bundle_initialize .
          python3 scripts/publish-release.py --assets "$RUNNER_TEMP/release-assets" \
            --tag "$CODEX_BUNDLE_TAG" --output-path "$CODEX_BUNDLE_OUTPUT_PATH" \
            --revision "$(git rev-parse HEAD)"

  install-smoke:
    name: Verify fresh release import
    needs: [prepare, publish]
    uses: ./.github/workflows/install-smoke.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  native-download-smoke:
    name: Verify public native download on a bare runner
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # No runtime libraries are installed: the static release must run as-is.
      - name: Download, verify, and smoke-test the published release
        run: |
          python3 - <<'PYTHON'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('client', 'scripts/install-release.py')
          client = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(client)
          releases = client.request('/releases?per_page=100')
          version = __import__('json').load(open('build.json'))['default_version']
          client.prepare(client.select(releases, version), Path(os.environ['RUNNER_TEMP']) / 'public-download')
          PYTHON
