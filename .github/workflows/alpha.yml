name: Alpha compatibility

on:
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Published rust-v alpha tag; blank selects newest alpha
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codex-alpha
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Select published alpha and bind its host digest
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_TAG: ${{ inputs.tag }}
        run: python3 scripts/check-alpha.py metadata --tag "$ALPHA_TAG" --output "$RUNNER_TEMP/alpha.json"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install pinned Rust conflict resolver
        run: bash scripts/setup-mergiraf.sh
      - name: Install runtime isolation tool
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Replay patches and exercise the alpha V8 host without publishing
        run: |
          set -euo pipefail
          smoke_python=$(nix build --impure --no-link --print-out-paths --expr '
            { repo }: let
              flake = builtins.getFlake repo;
              pkgs = import flake.inputs.nixpkgs { system = builtins.currentSystem; };
            in pkgs.python3.withPackages (ps: [ ps.h2 ])
          ' --argstr repo "$GITHUB_WORKSPACE")
          "$smoke_python/bin/python3" tests/static-runtime-test.py
          "$smoke_python/bin/python3" scripts/check-alpha.py validate --metadata "$RUNNER_TEMP/alpha.json" --sudo-runtime
