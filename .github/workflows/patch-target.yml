name: Check Codex 0.171.0

on:
  pull_request:
    paths:
      - patches/0.171.0/**
      - .github/workflows/patch-target.yml

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TARGET_VERSION: '0.171.0'
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            system-features = benchmark big-parallel kvm nixos-test codex-artifact-publisher
      - name: Install pinned Rust conflict resolver
        run: bash scripts/setup-mergiraf.sh
      - name: Reclaim disk space for Codex build
        shell: bash
        run: |
          set -euo pipefail
          sudo env \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            bash scripts/reclaim-runner-disk.sh

      - name: Install runtime isolation tool
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Add memory headroom for optimized Rust tests
        run: bash scripts/setup-build-swap.sh

      - name: Prepare target recipe locally
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-manifest.py "$TARGET_VERSION"
          test "$(nix eval --raw .#codex.version)" = "$TARGET_VERSION"
          git diff --check

      - name: Run shell suites
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/source-patcher.py
          python3 tests/manifest.py
          python3 tests/publication-gate.py
          python3 tests/release.py
          python3 tests/export-native.py
          python3 tests/release-workflow.py
          python3 tests/rebase-patches.py
          python3 tests/mergiraf.py
          python3 tests/release-client.py
          python3 tests/release-setup.py
          bash tests/package-policy.sh
          bash tests/update.sh
          bash tests/bundle.sh

      - name: Evaluate flake checks
        shell: bash
        run: nix flake check --no-build

      - name: Validate rendered nextest flags
        run: nix shell --inputs-from . nixpkgs#cargo nixpkgs#rustc nixpkgs#gcc nixpkgs#cargo-nextest --command python3 tests/nextest-flags.py

      - name: Build and test Codex binaries
        shell: bash
        run: |
          set -euo pipefail
          nix --extra-system-features codex-artifact-publisher build -L .#codex
          test "$(./result/bin/codex --version)" = "codex-cli $TARGET_VERSION"
          ./result/bin/codex-code-mode-host --help >/dev/null
          python3 scripts/export-native.py --package result --output-dir "$RUNNER_TEMP/native-assets" --version "$TARGET_VERSION"
          sudo bash tests/static-portability.sh result "$RUNNER_TEMP"/native-assets/codex-native-*.tar.gz
