name: ARM64 Linux disk trial
on:
  push:
    branches: [trial/arm64-linux-disk]
    paths: [.github/workflows/arm64-disk-trial.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Measure and reclaim disk
        run: |
          uname -m
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" bash scripts/reclaim-runner-disk.sh
      - name: Configure ARM64 musl toolchain
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --no-cache-dir ziglang==0.15.2
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s" -m ziglang "$@"\n' "$RUNNER_TEMP/zig/bin/python" > "$RUNNER_TEMP/bin/zig"
          chmod +x "$RUNNER_TEMP/bin/zig"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export CODEX_BUILD_MANIFEST="$RUNNER_TEMP/arm64-build.json"
          jq '
            .build.release_target = "aarch64-unknown-linux-musl"
            | .profiles["v8-152.2.0"].build_assets["aarch64-unknown-linux-musl"] = {
                RUSTY_V8_ARCHIVE: {
                  url: "https://github.com/openai/codex/releases/download/rusty-v8-v152.2.0/librusty_v8_ptrcomp_sandbox_release_aarch64-unknown-linux-musl.a.gz",
                  sha256: "1a60f36a3dd8778802e6980668c4d65a3c7305d85a5d2debf466d9aa0daadd75"
                },
                RUSTY_V8_SRC_BINDING_PATH: {
                  url: "https://github.com/openai/codex/releases/download/rusty-v8-v152.2.0/src_binding_ptrcomp_sandbox_release_aarch64-unknown-linux-musl.rs",
                  sha256: "3e4d5fecdbe0f98a6017e69d7ca82519a77fb032c5eb5e4cdbecdd3e2ec519d5"
                }
              }
          ' build.json > "$CODEX_BUILD_MANIFEST"
          echo "CODEX_BUILD_MANIFEST=$CODEX_BUILD_MANIFEST" >> "$GITHUB_ENV"
          bash scripts/setup-musl-toolchain.sh
          df -h "$RUNNER_TEMP" "$HOME"
      - name: Build and measure disk use
        run: |
          export CODEX_PATCH_CACHE="$RUNNER_TEMP/codex-patched"
          log="$RUNNER_TEMP/disk-kib.tsv"
          sample() {
            printf '%s\t%s\n' "$(date -u +%FT%TZ)" "$(df -k --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')"
          }
          sample > "$log"
          (while sleep 10; do sample; done) >> "$log" &
          monitor=$!
          finish() {
            kill "$monitor" 2>/dev/null || true
            wait "$monitor" 2>/dev/null || true
            sample >> "$log"
            awk 'NR==1 {start=min=$2} $2<min {min=$2} END {printf "Starting free space: %.2f GiB\nMinimum sampled free space: %.2f GiB\nPeak sampled growth: %.2f GiB\n", start/1048576, min/1048576, (start-min)/1048576}' "$log" | tee -a "$GITHUB_STEP_SUMMARY"
            df -h "$RUNNER_TEMP" "$HOME"
          }
          trap finish EXIT
          python3 scripts/install-source-codex.py --build-only --output "$RUNNER_TEMP/codex-linux-arm64.tar.gz"
          mkdir "$RUNNER_TEMP/verify"
          tar -xzf "$RUNNER_TEMP/codex-linux-arm64.tar.gz" -C "$RUNNER_TEMP/verify"
          for name in codex codex-code-mode-host; do
            file="$RUNNER_TEMP/verify/$name"
            readelf -hW "$file" | grep 'Machine:.*AArch64'
            if readelf -lW "$file" | grep -w INTERP || readelf -dW "$file" | grep '(NEEDED)'; then
              echo "Dynamically linked binary: $name" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-linux-arm64
          path: ${{ runner.temp }}/codex-linux-arm64.tar.gz
          if-no-files-found: error
