name: Native Linux bundle

on:
  push:
    branches: [main]
    paths:
      - build.json
      - patches/**
      - scripts/install-source-codex.py
      - .github/workflows/native.yml
  workflow_dispatch:
    inputs:
      version:
        description: Supported version (empty builds all manifest releases)
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - id: versions
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          versions = list(json.loads(Path('build.json').read_text())['releases'])
          requested = os.environ['REQUESTED_VERSION']
          if requested:
              assert requested in versions, 'version must exist in build.json'
              versions = [requested]
          assert all(re.fullmatch(r'\d+\.\d+\.\d+', version) for version in versions)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('versions=' + json.dumps(versions) + '\n')
          PY

  build:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    concurrency:
      group: native-${{ github.ref }}-${{ matrix.version }}
      cancel-in-progress: false
    env:
      VERSION: ${{ matrix.version }}
      CARGO_BUILD_JOBS: 2
      CODEX_PATCH_CACHE: ${{ github.workspace }}/.native-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libcap-dev libasound2-dev clang cmake
      - name: Reclaim runner disk space
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" bash scripts/reclaim-runner-disk.sh
      - name: Test installer and build regular binaries
        run: |
          python3 tests/source-patcher.py
          python3 scripts/install-source-codex.py --build-only --version "$VERSION" --output dist/codex-linux-x86_64.tar.gz
      - name: Verify runtime dependencies and smoke tests
        run: |
          mkdir -p smoke
          tar -xzf dist/codex-linux-x86_64.tar.gz -C smoke
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for name, checksum in json.loads(Path('smoke/sha256.json').read_text()).items():
              with (Path('smoke') / name).open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == checksum
          PY
          for binary in smoke/codex smoke/codex-code-mode-host; do
            ldd "$binary" > linkage.txt
            cat linkage.txt
            if grep -E 'not found|/nix/store/' linkage.txt; then exit 1; fi
          done
          test "$(smoke/codex --version)" = "codex-cli $VERSION"
          smoke/codex-code-mode-host --help >/dev/null
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-native-${{ matrix.version }}
          path: dist/codex-linux-x86_64.tar.gz
          retention-days: 14
      - name: Publish immutable recipe-specific release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key=$(python3 -c 'import json; print(json.load(open("smoke/bundle.json"))["key"])')
          tag="native-$key"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Existing releases are immutable; validate the published inventory.
            gh release download "$tag" --pattern codex-linux-x86_64.tar.gz --dir existing
            python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          expected = json.loads(Path('smoke/bundle.json').read_text())
          with tarfile.open('existing/codex-linux-x86_64.tar.gz') as archive:
              members = archive.getmembers()
              names = {'codex', 'codex-code-mode-host', 'sha256.json', 'bundle.json'}
              assert len(members) == len(names) and {m.name for m in members} == names
              assert all(m.isfile() for m in members)
              assert json.load(archive.extractfile('bundle.json')) == expected
              inventory = json.load(archive.extractfile('sha256.json'))
              assert set(inventory) == names - {'sha256.json', 'bundle.json'}
              for name, checksum in inventory.items():
                  assert hashlib.file_digest(archive.extractfile(name), 'sha256').hexdigest() == checksum
          PY
          else
            gh release create "$tag" dist/codex-linux-x86_64.tar.gz \
              --target "$(git rev-parse HEAD)" --title "Codex $VERSION native Linux" \
              --notes 'Patched x86_64 GNU/Linux binaries, built on Ubuntu 24.04. No Nix required.' \
              --latest=false
          fi
