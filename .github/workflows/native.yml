name: Update native Codex
run-name: Native Codex (${{ inputs.version || 'latest stable' }})
on:
  schedule:
    - cron: '43 4 * * *'
  push:
    branches: [main]
    paths: ['native-build.json', 'patches/**', 'scripts/**', 'tests/**', '.github/workflows/native.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Stable upstream version; blank selects latest
        type: string
        required: false
      recover_run:
        description: Recover a tested build from this Actions run without recompiling
        type: string
        required: false
concurrency:
  group: native-codex
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      base: ${{ steps.prepare.outputs.base }}
      sha: ${{ steps.candidate.outputs.sha }}
      key: ${{ steps.prepare.outputs.key }}
      build: ${{ steps.prepare.outputs.build }}
      build_revision: ${{ steps.recover.outputs.revision || steps.candidate.outputs.sha }}
    env:
      CARGO_BUILD_JOBS: 2
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare latest stable source and patch stack
        id: prepare
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RECOVER_RUN: ${{ inputs.recover_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/native-release.py prepare --version "$REQUESTED_VERSION" --recover-run "$RECOVER_RUN"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate updater and installer
        if: steps.prepare.outputs.build == 'true'
        run: |
          python3 tests/source-patcher.py
          python3 tests/manifest.py
          python3 tests/rebase-patches.py
          python3 tests/release-client.py
          python3 tests/native-release.py
          python3 tests/release-setup.py
          git diff --check
      - name: Install build and test dependencies
        if: steps.prepare.outputs.build == 'true' && steps.prepare.outputs.recover != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libcap-dev libasound2-dev clang cmake
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" bash scripts/reclaim-runner-disk.sh
          curl -fL --retry 3 -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/cargo-nextest-0.9.146-x86_64-unknown-linux-gnu.tar.gz
          echo '682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428  '"$RUNNER_TEMP/nextest.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/nextest" cargo-nextest
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - name: Build, test patches, and verify binary pair
        if: steps.prepare.outputs.build == 'true' && steps.prepare.outputs.recover != 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          CODEX_BUILD_MANIFEST: ${{ github.workspace }}/native-build.json
          CODEX_VERIFY_PATCHES: '1'
        run: |
          set -euo pipefail
          unset NO_COLOR TMUX TERM_PROGRAM
          mkdir -p "$RUNNER_TEMP/codex-home"
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          export CODEX_PATCH_CACHE="$RUNNER_TEMP/native-cache"
          python3 scripts/install-source-codex.py --build-only --version "$VERSION" --output dist/codex-linux-x86_64.tar.gz
          mkdir smoke
          tar -xzf dist/codex-linux-x86_64.tar.gz -C smoke
          for binary in smoke/codex smoke/codex-code-mode-host; do
            ldd "$binary" > linkage.txt
            cat linkage.txt
            if grep -E 'not found|/nix/store/' linkage.txt; then exit 1; fi
          done
      - name: Download retained verified build
        if: steps.prepare.outputs.recover == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-release-${{ inputs.recover_run }}
          run-id: ${{ inputs.recover_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/recovered-native
      - name: Restore recovered binary and build provenance
        id: recover
        if: steps.prepare.outputs.recover == 'true'
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/recovered-native/dist/codex-linux-x86_64.tar.gz" dist/
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          metadata = json.loads((Path(os.environ['RUNNER_TEMP']) / 'recovered-native/dist/release.json').read_text())
          revision = metadata.get('build_revision', metadata['revision'])
          assert re.fullmatch(r'[a-f0-9]{40}', revision)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision + '\n')
          PYTHON
      - name: Save verified candidate
        id: candidate
        if: steps.prepare.outputs.build == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-build.json patches
          if ! git diff --cached --quiet; then
            git commit -m 'codex: advance verified native release'
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git bundle create "$RUNNER_TEMP/native-source.bundle" HEAD
      - name: Upload verified source
        if: steps.prepare.outputs.build == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-source-${{ github.run_id }}
          path: ${{ runner.temp }}/native-source.bundle
          retention-days: 14
      - name: Retain build and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-release-${{ github.run_id }}
          path: |
            dist/*
            native-build.json
            patches/
          retention-days: 14
      - name: Explain failure
        if: failure()
        run: |
          echo '### Native update blocked' >> "$GITHUB_STEP_SUMMARY"
          echo 'The last published release remains available. Inspect the first failed step: a three-way patch conflict or changed dependency profile requires a reviewed port; build/test failures must pass before publication. Candidate patches and manifest are retained in artifacts.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified native release
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.base }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-source-${{ github.run_id }}
          path: ${{ runner.temp }}/native-source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-release-${{ github.run_id }}
          path: ${{ runner.temp }}/native-assets
      - name: Restore exact tested source
        env:
          EXPECTED_SHA: ${{ needs.release.outputs.sha }}
        run: |
          git fetch "$RUNNER_TEMP/native-source/native-source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git checkout --detach "$EXPECTED_SHA"
      - name: Advance source without overwriting concurrent changes
        env:
          BASE_SHA: ${{ needs.release.outputs.base }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$BASE_SHA" ]]; then
            git push origin HEAD:refs/heads/main
          else
            # GITHUB_TOKEN cannot create a release on an old workflow revision.
            # Use current main; the publisher rejects any changed binary recipe.
            git fetch origin main
            git checkout --detach FETCH_HEAD
          fi
      - name: Publish immutable native release
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_BUILD_RUN_ID: ${{ inputs.recover_run || github.run_id }}
          CODEX_BUILD_REVISION: ${{ needs.release.outputs.build_revision }}
        run: python3 scripts/native-release.py publish --assets "$RUNNER_TEMP/native-assets/dist"

  download-smoke:
    name: Verify public native download
    needs: [release, publish]
    if: always() && github.ref == 'refs/heads/main' && needs.release.result == 'success' && (needs.publish.result == 'success' || needs.release.outputs.build == 'false')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.base }}
          persist-credentials: false
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libcap2
      - name: Verify public release download on a fresh runner
        env:
          RELEASE_KEY: ${{ needs.release.outputs.key }}
        run: |
          python3 - <<'PYTHON'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('client', 'scripts/install-release.py')
          client = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(client)
          release = client.request('/releases/tags/native-' + os.environ['RELEASE_KEY'])
          client.prepare(release, Path(os.environ['RUNNER_TEMP']) / 'public-download')
          PYTHON
